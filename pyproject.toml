[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jvsg-triage"
version = "0.1.0"
description = "JVSG Non-CM triage and veteran stability-constraints project"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
data = [
  "polars>=1.0",
  "pandas>=2.2",
  "openpyxl>=3.1",
]
api = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "mcp>=1.1",
]
slm = [
  "instructor>=1.4",
  "openai>=1.50",
]
m365 = [
  "azure-identity>=1.17",
  "azure-keyvault-secrets>=4.8",
  "msgraph-sdk>=1.0",
]
azure = [
  "azure-functions>=1.20",
]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
  "types-openpyxl>=3.1",
]
all = [
  "polars>=1.0",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "mcp>=1.1",
  "instructor>=1.4",
  "openai>=1.50",
  "azure-identity>=1.17",
  "azure-keyvault-secrets>=4.8",
  "msgraph-sdk>=1.0",
  "azure-functions>=1.20",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["jvsg_triage"]
strict = true
warn_unused_configs = true
